# Mac, Docker ağındaki sanal IP'ye doğrudan erişemez; localhost'taki portları oraya iletir.
# Gerçek ortamda bunun karşılığı, DNS kaydının sanal IP'yi göstermesidir.
defaults
  mode tcp
  timeout connect 5s
  timeout client 5m
  timeout server 5m

frontend fe_dashboards
  bind *:443
  default_backend be_dashboards

frontend fe_opensearch
  bind *:9200
  default_backend be_opensearch

backend be_dashboards
  server vip 172.28.50.40:443

backend be_opensearch
  server vip 172.28.50.40:9200
